baseURL = 'https://domainforvijay.in/'
languageCode = 'en-us'
title = 'Vijay Bambhaniya'
theme = 'PaperMod'
enableRobotsTXT = true

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[params]
  env = "production"
  description = "Software Engineering Leader | 12+ Years Experience | Building Scalable Systems"
  author = "Vijay Bambhaniya"
  keywords = ["software engineering", "system design", "architecture", "backend engineering", "domain driven design", "technical leadership", "scalable systems", "Vijay Bambhaniya"]
  images = ["/images/site-cover.png"]

  [params.schema]
    publisherType = "Person"

  # Uncomment below to add Google Search Console verification
  # [params.analytics.google]
  #   SiteVerificationTag = "your-google-site-verification-tag"
  
  [params.homeInfoParams]
    Title = "Hi, I'm Vijay 👋"
    Content = """
Software Engineering Leader with 12+ years of experience designing scalable systems and leading high-performing teams. 
Currently at **Acko Insurance** building travel insurance platforms and AI-powered solutions.

Passionate about solving complex technical challenges, Domain Driven Design, and mentoring engineers.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/00imvj00"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/vijay-enggr"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:socialforvijay@gmail.com"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Thoughts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Tenets"
    url = "/tenets/"
    weight = 3
  [[menu.main]]
    name = "Work"
    url = "/work/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5

[services]
  [services.googleAnalytics]
    id = "G-4TWMQ7ZZ4P"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
